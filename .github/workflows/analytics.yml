name: Atualizar GitHub Analytics

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/github_analytics.py
      - .github/workflows/analytics.yml

permissions:
  contents: write

concurrency:
  group: github-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar painel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USERNAME: yada071
        run: python scripts/github_analytics.py
      - name: Publicar imagem atualizada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-analytics.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: atualiza GitHub Analytics'
            git push
          fi
